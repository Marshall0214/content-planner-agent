[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "content-planner-agent"
version = "0.1.0"
description = "Bounded content planning agent with an explicit offline mock and SQLite ledger"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3", "openai>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
content-planner = "content_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.cache/pytest"

